<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro — Únete a la comunidad</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <header class="site-header small">
    <a href="Pág.Princ.html" class="back">← Volver</a>
 </header>
    <section class="hero">
    <div class="hero-card">
    <h1>Registro</h1>
    <h2>Únete a la comunidad</h2>
    </div>
  </section>
  
  <main class="container content">
    <section>
    <h2><p>Rellena todos los datos y recibirás instrucciones para unirte al discord oficial de Better Play, así como nuestros planes para que puedas aprender de la gente que esta actualmente en la cima</p></h2>
    </section>
    
    <form id="registerForm" class="form-card">
      <label for="name">Nombre</label>
      <input id="name" required />

      <label for="mcname">Usuario Minecraft</label>
      <input id="mcname" required />

      <label for="email">Correo</label>
      <input id="email" type="email" required />

      <label for="role">Interés principal</label>
      <select id="role">
        <option>PvP</option>
        <option>Construcción</option>
        <option>Speedrun</option>
        <option>Parkour</option>
        <option>Técnico</option>
        <option>Mapas</option>
      </select>

      <button type="submit" class="btn">Solicitar invitación</button>
    </form>

  <footer class="site-footer">
    <p>© 2025 Mejora tu Juego — Mejora cada vez mejor a tu Manera </p>
  </footer>
  <script src="BdD.js"></script>
</body>
</html>
